<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanderlust — A Journey Through the World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400&family=Playfair+Display:ital,wght@0,400;1,400;1,700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#c9a96e;--gold-light:#e8d5a8;--cream:#f5f0e8;
  --dark:#0a0908;--dark2:#15120e;--muted:rgba(255,255,255,0.35);
  --left:33%;--right:67%;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--dark);color:var(--cream);cursor:none}

/* ── CURSOR ── */
#cursor{position:fixed;z-index:9999;width:10px;height:10px;border:1px solid var(--gold);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s}
#cursor.expand{width:32px;height:32px;background:rgba(201,169,110,.1)}

/* ── LEFT PANEL (foreground slides) ── */
#left-panel{
  position:fixed;left:0;top:0;
  width:var(--left);height:100vh;
  overflow:hidden;
  z-index:10;
  /* subtle gradient separator */
  border-right:1px solid rgba(201,169,110,.1);
}
/* dark bg for left panel so text is always readable */
#left-panel::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to right, rgba(10,9,8,.96) 70%, rgba(10,9,8,.7) 100%);
  z-index:0;pointer-events:none;
}

#fg-track{
  position:absolute;left:0;top:0;width:100%;
  will-change:transform;
  transition:transform 1.3s cubic-bezier(.77,0,.175,1);
  z-index:1;
}

.slide{
  width:100%;height:100vh;
  display:flex;align-items:center;
  padding:0 10% 0 12%;
}
.slide-content{width:100%;max-width:100%}

.slide-meta{display:flex;align-items:center;gap:12px;margin-bottom:22px;opacity:0;transform:translateY(14px);transition:opacity .8s .18s ease,transform .8s .18s ease}
.slide-chapter{font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:9px;letter-spacing:.44em;text-transform:uppercase;color:var(--gold)}
.meta-line{width:28px;height:1px;background:var(--gold);opacity:.45}
.slide-number{font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:9px;letter-spacing:.2em;color:var(--muted)}

.slide-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.4rem,4.2vw,3.8rem);line-height:1.06;color:var(--cream);margin-bottom:10px;opacity:0;transform:translateY(20px);transition:opacity .9s .33s ease,transform .9s .33s ease}
.slide-title em{font-style:italic;font-weight:300;color:var(--gold-light)}

.slide-subtitle{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(.85rem,1.4vw,1.1rem);color:var(--gold);margin-bottom:18px;opacity:0;transform:translateY(16px);transition:opacity .8s .5s ease,transform .8s .5s ease}

.slide-rule{display:flex;align-items:center;gap:8px;margin-bottom:18px;opacity:0;transition:opacity .8s .58s ease}
.slide-rule::before,.slide-rule::after{content:'';flex:0 0 22px;height:1px;background:var(--gold);opacity:.35}
.diamond{width:4px;height:4px;background:var(--gold);transform:rotate(45deg);opacity:.65}

.slide-body{font-family:'Josefin Sans',sans-serif;font-weight:300;font-size:clamp(.72rem,1.05vw,.85rem);letter-spacing:.07em;line-height:1.9;color:rgba(245,240,232,.58);margin-bottom:24px;opacity:0;transform:translateY(10px);transition:opacity .8s .7s ease,transform .8s .7s ease}

.slide-tags{display:flex;gap:8px;flex-wrap:wrap;opacity:0;transform:translateY(8px);transition:opacity .7s .86s ease,transform .7s .86s ease}
.slide-tag{font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,169,110,.25);padding:4px 10px}

.slide.active .slide-meta,.slide.active .slide-title,.slide.active .slide-subtitle,
.slide.active .slide-rule,.slide.active .slide-body,.slide.active .slide-tags{opacity:1;transform:translateY(0)}

/* ── RIGHT PANEL (photo wall) ── */
#right-panel{
  position:fixed;right:0;top:0;
  width:var(--right);height:100vh;
  overflow:hidden;
  z-index:1;
}

#bg-canvas{
  position:absolute;
  left:0;top:-4000px;width:100%;
  /* height set by JS */
  will-change:transform;
  display:flex;
  gap:4px;
  align-items:flex-start;
  padding:4px;
}

/* three equal columns */
.col{
  flex:1 1 0;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.photo-tile{
  width:100%;
  overflow:hidden;
  flex-shrink:0;
  background:var(--dark2);
}

.photo-tile img{
  width:100%;height:100%;
  object-fit:cover;display:block;
  filter:brightness(.55) saturate(.8);
  transition:filter .6s ease;
}

.photo-tile:hover img{ filter:brightness(.72) saturate(1); }

/* placeholder for tiles without img */
.photo-tile-ph{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:9px;
  letter-spacing:.28em;text-transform:uppercase;color:rgba(245,240,232,.18);
}
.photo-tile-ph svg{width:32px;height:32px;fill:none;stroke:rgba(245,240,232,.15);stroke-width:.8}

/* thin dark gradient on right panel edges */
#right-panel::before{
  content:'';position:absolute;left:0;top:0;width:40px;height:100%;
  background:linear-gradient(to right,rgba(10,9,8,.5),transparent);
  z-index:2;pointer-events:none;
}
#right-panel::after{
  content:'';position:absolute;top:0;bottom:0;right:0;width:0;height:100%;
  z-index:2;pointer-events:none;
}

/* ── UI CHROME ── */
#progress-bar{position:fixed;bottom:0;left:0;height:2px;background:var(--gold);width:0%;z-index:100;transition:width 1.2s cubic-bezier(.77,0,.175,1);box-shadow:0 0 6px rgba(201,169,110,.35)}

#slide-counter{position:fixed;bottom:22px;left:calc(var(--left) - 80px);z-index:100;font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:10px;letter-spacing:.22em;color:var(--muted);display:flex;align-items:center;gap:6px}
#slide-counter .cur{font-weight:300;color:var(--gold);font-size:13px}

/* nav arrows inside left panel */
.nav-btn{position:fixed;z-index:200;background:none;border:none;cursor:none;padding:12px;display:flex;align-items:center;justify-content:center}
.nav-btn:disabled{opacity:.15;pointer-events:none}
#nav-prev{bottom:52px;left:10%}
#nav-next{bottom:52px;left:calc(10% + 52px)}
.nav-btn svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1;transition:stroke .2s,transform .2s}
.nav-btn:hover svg{stroke:var(--gold-light);transform:scale(1.15)}

#site-title{position:fixed;top:24px;left:12%;z-index:100;font-family:'IM Fell English',serif;font-size:17px;letter-spacing:.08em;color:var(--gold);opacity:.9}
#site-title span{font-style:italic;font-size:10px;font-family:'Josefin Sans',sans-serif;font-weight:100;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);display:block;margin-top:2px}

/* vertical dots inside left panel */
#slide-dots{position:fixed;left:5%;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center}
.dot{width:3px;height:3px;border-radius:50%;background:rgba(201,169,110,.2);transition:background .4s,transform .4s;cursor:pointer}
.dot.active{background:var(--gold);transform:scale(1.7)}

#hint{position:fixed;bottom:22px;left:12%;font-family:'Josefin Sans',sans-serif;font-weight:100;font-size:8px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);opacity:1;transition:opacity 1s;z-index:100}
#hint.hidden{opacity:0;pointer-events:none}
</style>
</head>

<div id="site-title">Wanderlust<span>A Journey Through the World</span></div>

// ── Calculate bg-canvas total height for parallax math ───────────────────────
// We need: bgTotalH so that when fg has scrolled (TOTAL-1)*VH downward (slides going up),
// bg scrolls (TOTAL-1)*VH*PARALLAX in the opposite direction (downward).
// bg starts at translateY(0) and goes to translateY(+(TOTAL-1)*VH*PARALLAX).
// So bg needs to extend above the viewport by that amount.
// Simplest: offset bg-canvas top by -startOffset, and scroll it down from there.

const bgCanvas = document.getElementById('bg-canvas');

// ── Foreground slides ─────────────────────────────────────────────────────────
const fgTrack = document.getElementById('fg-track');
fgTrack.style.height = (TOTAL * 100) + 'vh';

const dotsEl = document.getElementById('slide-dots');
SLIDES.forEach((d, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' active' : '');
  slide.style.top = (i * 100) + 'vh';
  slide.innerHTML = `
    <div class="slide-content">
      <div class="slide-meta">
        <span class="slide-chapter">${d.ch}</span>
        <span class="meta-line"></span>
        <span class="slide-number">${String(i+1).padStart(2,'0')} / 25</span>
      </div>
      <h2 class="slide-title">${d.title}</h2>
      <p class="slide-subtitle">${d.sub}</p>
      <div class="slide-rule"><div class="diamond"></div></div>
      <p class="slide-body">${d.body}</p>
      <div class="slide-tags">${d.tags.map(t=>`<span class="slide-tag">${t}</span>`).join('')}</div>
    </div>`;
  fgTrack.appendChild(slide);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(dot);
});

const slideEls = document.querySelectorAll('.slide');
const dotEls   = document.querySelectorAll('.dot');

// ── Parallax state ────────────────────────────────────────────────────────────
let current     = 0;
let isAnimating = false;
let bgCurrentY  = 0;
let bgTargetY   = 0;
let rafId       = null;

// bg scrolls DOWN (positive translateY) as slides advance (fg goes up)
// fg slide 0 → bgY = 0
// fg slide N → bgY = +N * VH * PARALLAX
function getBgTarget(idx) {
  return idx * VH * PARALLAX;
}

function lerp(a, b, t) { return a + (b - a) * t; }

function animateBg() {
  const diff = bgTargetY - bgCurrentY;
  if (Math.abs(diff) < 0.08) {
    bgCurrentY = bgTargetY;
    bgCanvas.style.transform = `translateY(${bgCurrentY}px)`;
    rafId = null;
    return;
  }
  bgCurrentY = lerp(bgCurrentY, bgTargetY, 0.065);
  bgCanvas.style.transform = `translateY(${bgCurrentY}px)`;
  rafId = requestAnimationFrame(animateBg);
}

function goTo(idx) {
  if (isAnimating || idx === current || idx < 0 || idx >= TOTAL) return;
  isAnimating = true;

  slideEls[current].classList.remove('active');
  dotEls[current].classList.remove('active');
  current = idx;

  // FG goes UP
  fgTrack.style.transform = `translateY(-${current * 100}vh)`;

  // BG goes DOWN at 40% rate
  bgTargetY = getBgTarget(current);
  if (!rafId) rafId = requestAnimationFrame(animateBg);

  slideEls[current].classList.add('active');
  dotEls[current].classList.add('active');
  document.getElementById('cc').textContent = String(current+1).padStart(2,'0');
  document.getElementById('progress-bar').style.width = ((current+1)/TOTAL*100)+'%';
  document.getElementById('nav-prev').disabled = current === 0;
  document.getElementById('nav-next').disabled = current === TOTAL - 1;
  document.getElementById('hint').classList.add('hidden');

  setTimeout(() => { isAnimating = false; }, 1350);
}

// Controls
document.getElementById('nav-prev').addEventListener('click', () => goTo(current-1));
document.getElementById('nav-next').addEventListener('click', () => goTo(current+1));
document.addEventListener('keydown', e => {
  if (e.key==='ArrowDown'||e.key==='ArrowRight') goTo(current+1);
  if (e.key==='ArrowUp'||e.key==='ArrowLeft')    goTo(current-1);
});

let touchY = 0;
document.addEventListener('touchstart', e=>{ touchY=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend', e=>{
  const dy = touchY - e.changedTouches[0].clientY;
  if (Math.abs(dy)>40) goTo(dy>0 ? current+1 : current-1);
},{passive:true});

let wCool = false;
document.addEventListener('wheel', e=>{
  if(wCool) return; wCool=true;
  goTo(e.deltaY>0 ? current+1 : current-1);
  setTimeout(()=>{wCool=false;},1500);
},{passive:true});

// Cursor
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', e=>{
  cursorEl.style.left=e.clientX+'px';
  cursorEl.style.top=e.clientY+'px';
});
document.querySelectorAll('button,.dot').forEach(el=>{
  el.addEventListener('mouseenter',()=>cursorEl.classList.add('expand'));
  el.addEventListener('mouseleave',()=>cursorEl.classList.remove('expand'));
});

// Init
document.getElementById('nav-prev').disabled = true;
document.getElementById('progress-bar').style.width = (1/TOTAL*100)+'%';
bgCanvas.style.transform = 'translateY(0px)';
</script>
</body>
</html>
